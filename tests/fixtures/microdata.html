<!doctype html>
<html><head><title>Quick Pancakes</title></head>
<body>
<nav>Sidebar ads and cookie banners everywhere</nav>
<article itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Quick Pancakes</h1>
  <span itemprop="recipeYield">4 pancakes</span>
  <time itemprop="prepTime" datetime="PT10M">10 minutes</time>
  <time itemprop="cookTime" datetime="PT15M">15 minutes</time>
  <ul>
    <li itemprop="recipeIngredient">2 eggs</li>
    <li itemprop="recipeIngredient">250 ml milk</li>
    <li itemprop="recipeIngredient">150 g flour</li>
  </ul>
  <ol>
    <li itemprop="recipeInstructions">Whisk the eggs with milk.</li>
    <li itemprop="recipeInstructions">Fold in the flour.</li>
    <li itemprop="recipeInstructions">Fry until golden.</li>
  </ol>
</article>
</body></html>
